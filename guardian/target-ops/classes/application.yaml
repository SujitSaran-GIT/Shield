spring:
  application:
    name: Shield Authentication Platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guardian}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Saran@2002}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: ${DB_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 1000ms
      timeout: 1000ms
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:6061}
  shutdown: graceful
  # IP trust is handled explicitly by IpUtil, never by arbitrary forwarded headers.
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  issuer: ${JWT_ISSUER:shield-auth-platform}

app:
  bootstrap:
    secret: ${APP_BOOTSTRAP_SECRET:}
  enrollment:
    client-admin-public-enabled: ${APP_CLIENT_ADMIN_PUBLIC_ENABLED:false}
  security:
    cookie-secure: ${COOKIE_SECURE:true}
  mail:
    from: ${SMTP_FROM:shield@localhost}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:90}
  location:
    retention-days: ${LOCATION_RETENTION_DAYS:30}

security:
  trusted-proxies: ${TRUSTED_PROXIES:}
  legacy-encryption-key: ${LEGACY_ENCRYPTION_KEY:}

rate-limit:
  mode: ${RATE_LIMIT_MODE:redis}
  outage-policy: ${RATE_LIMIT_OUTAGE_POLICY:fail-closed}
  local-max-keys: 10000
  login:
    max-attempts: 5
    duration-minutes: 5
  registration:
    success-per-minutes: 5
    max-failed-attempts: 5
  endpoint:
    auth-capacity: 30
    write-capacity: 60
    privileged-capacity: 10
    window-seconds: 60

geoip:
  database-path: ${GEOIP_DB_PATH:geoip/GeoLite2-City.mmdb}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: SUPER_ADMIN
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: shield-auth-platform

websocket:
  update-interval: 30000
  dashboard-update-interval: 30000
  alert-check-interval: 60000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.guardian: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ssXXX} %-5level [%X{requestId:-background}] %logger{32} - %msg%n"
