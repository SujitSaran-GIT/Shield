spring.datasource.url=jdbc:h2:mem:shield;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.mail.host=localhost
jwt.secret=unit-test-only-random-key-material-32-bytes-minimum
jwt.expiration=900000
jwt.refresh-expiration=604800000
jwt.issuer=shield-test
cors.allowed-origins=http://localhost:5173
app.security.cookie-secure=false
rate-limit.mode=local
logging.level.root=WARN
management.health.redis.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db
geoip.database-path=target-test/no-geoip.mmdb
websocket.update-interval=3600000
websocket.dashboard-update-interval=3600000
websocket.alert-check-interval=3600000
